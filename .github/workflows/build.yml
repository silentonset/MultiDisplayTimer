name: Build MultiDisplayTimer

on:
  workflow_dispatch:
    inputs:
      mac_arch:
        description: 'macOS architecture (universal = Apple Silicon + Intel)'
        required: true
        default: 'universal'
        type: choice
        options:
          - universal
          - arm64
          - x64
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build-mac:
    name: Build macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          ARCH="${{ inputs.mac_arch || 'universal' }}"
          npx electron-builder --mac dmg zip --"$ARCH" --publish never

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiDisplayTimer-macOS-${{ inputs.mac_arch || 'universal' }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-win:
    name: Build Windows (Portable .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --publish never

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiDisplayTimer-Windows-Portable
          path: dist/*.exe
          if-no-files-found: error
